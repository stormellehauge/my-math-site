<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BREAK THE LOGIC — Math Hub (EN / 中文)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6fbff; --card:#ffffff; --accent:#1a73e8; --accent-2:#0b5fff; --muted:#5b6b86; --success:#08c27b; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:#072033}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid rgba(7,32,51,0.04)}
  .brand{font-weight:900;font-size:24px}
  .controls{display:flex;gap:12px;align-items:center}
  .points{background:linear-gradient(90deg,#fff,#f3fbff);padding:8px 12px;border-radius:10px;border:1px solid rgba(7,32,51,0.04);font-weight:800}
  .btn{background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;border:0;cursor:pointer;font-weight:700}
  .btn.secondary{background:transparent;border:1px solid rgba(7,32,51,0.06);color:#072033}
  main{padding:14px 20px}
  .layout{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
  .card{background:var(--card);padding:12px;border-radius:10px;box-shadow:0 8px 24px rgba(7,32,51,0.03)}
  .small{font-size:13px;color:var(--muted)}
  .game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
  .tile{padding:12px;border-radius:10px;border:1px solid rgba(7,32,51,0.04);cursor:pointer;background:linear-gradient(180deg,#fff,#f7fbff);transition:transform .18s}
  .tile:hover{transform:translateY(-6px)}
  .page{display:none}
  .page.active{display:block}
  .question{font-size:18px;margin:12px 0}
  .answers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .ans-btn{padding:10px;border-radius:8px;border:1px solid rgba(7,32,51,0.06);background:#fff;cursor:pointer;font-weight:700}
  .ans-btn.correct{background:linear-gradient(90deg,#e6fff1,#bff6d9);border-color:rgba(8,194,123,0.9)}
  .ans-btn.wrong{background:linear-gradient(90deg,#ffecec,#ffd6d6);border-color:rgba(239,68,68,0.9)}
  #fxCanvas{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999}
  .langToggle{display:flex;gap:6px}
  .langBtn{padding:6px 8px;border-radius:6px;border:1px solid rgba(7,32,51,0.06);background:transparent;cursor:pointer}
  .tile .playWrap{display:flex;align-items:center;gap:8px;margin-top:8px}
  .reel{display:inline-block;width:92px;height:92px;border-radius:8px;background:#fff;border:1px solid rgba(7,32,51,0.06);display:flex;align-items:center;justify-content:center;font-size:32px;margin-right:6px}
  @media(max-width:980px){ .layout{grid-template-columns:1fr} .game-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div>
    <div class="brand" id="brandText">BREAK THE LOGIC</div>
    <div class="small" id="tagline">Math games hub — train logic, speed, and math knowledge</div>
  </div>
  <div class="controls">
    <div class="points"><span id="pointsLabel">Points:</span> <span id="points">0</span></div>
    <div class="langToggle">
      <button class="langBtn" id="enBtn">EN</button>
      <button class="langBtn" id="zhBtn">中文</button>
    </div>
    <button class="btn secondary" id="exportBtn">Export</button>
    <button class="btn secondary" id="resetBtn">Reset</button>
  </div>
</header>

<main>
  <div class="layout">
    <section>
      <div class="card">
        <h2 id="hubTitle">Game Hub — Math Edition</h2>
        <p class="small" id="hubDesc">All games are available on the home page. Click Play on any tile to open the embedded game UI.</p>
        <div class="game-grid" id="tilesContainer"></div>
      </div>
    </section>

    <aside>
      <div class="card">
        <h3 id="profileTitle">Profile</h3>
        <div class="small" id="profileText">Earn points to climb tiers.</div>
        <div style="margin-top:10px;display:flex;gap:8px">
          <button class="btn secondary" id="exportPoints">Export</button>
          <button class="btn secondary" id="resetPoints">Reset</button>
        </div>
      </div>

      <div class="card" style="margin-top:12px">
        <h4 id="tierTitle">Tier</h4>
        <div class="small" id="tierText" style="margin-top:8px">Tier progress shown here.</div>
        <div style="margin-top:8px;height:12px;background:rgba(7,32,51,0.06);border-radius:999px;overflow:hidden">
          <div id="tierFill" style="height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s"></div>
        </div>
      </div>

      <div class="card" style="margin-top:12px">
        <h4 id="recentTitle">Recent</h4>
        <div class="small" id="recentList" style="margin-top:8px">No recent wins.</div>
      </div>
    </aside>
  </div>
</main>

<canvas id="fxCanvas"></canvas>

<script>
/* ============
   Localization (EN / ZH)
   ============ */
const LANG = {
  en: {
    brand: 'BREAK THE LOGIC',
    tagline: 'Math games hub — train logic, speed, and math knowledge',
    hubTitle: 'Game Hub — Math Edition',
    hubDesc: 'All games are available on the home page. Click Play on any tile to open the embedded game UI.',
    profileTitle: 'Profile',
    tierTitle: 'Tier',
    recentTitle: 'Recent',
    export: 'Export',
    reset: 'Reset',
    play: 'Play',
    close: 'Close',
    ready: 'Ready',
    triviaLevel: 'Level',
    triviaStart: 'Start Round',
    timerNote: '5s per question',
    back: 'Back'
  },
  zh: {
    brand: '破除逻辑',
    tagline: '数学游戏中心 — 训练逻辑、速度和数学能力',
    hubTitle: '游戏中心 — 数学版',
    hubDesc: '所有游戏都在主页。点击每个格子内的 Play 打开游戏界面。',
    profileTitle: '个人',
    tierTitle: '段位',
    recentTitle: '近期',
    export: '导出',
    reset: '重置',
    play: '开始',
    close: '关闭',
    ready: '就绪',
    triviaLevel: '等级',
    triviaStart: '开始回合',
    timerNote: '每题 5 秒',
    back: '返回'
  }
};
let lang = localStorage.getItem('btl_lang') || 'en';
function t(key){ return (LANG[lang] && LANG[lang][key]) || LANG.en[key] || key; }
function applyLanguage(){
  document.getElementById('brandText').textContent = t('brand');
  document.getElementById('tagline').textContent = t('tagline');
  document.getElementById('hubTitle').textContent = t('hubTitle');
  document.getElementById('hubDesc').textContent = t('hubDesc');
  document.getElementById('profileTitle').textContent = t('profileTitle');
  document.getElementById('tierTitle').textContent = t('tierTitle');
  document.getElementById('recentTitle').textContent = t('recentTitle');
  document.getElementById('exportBtn').textContent = t('export');
  document.getElementById('resetBtn').textContent = t('reset');
  // update tiles text labels
  renderTiles(); // rebuild to update button labels/descriptions
}
document.getElementById('enBtn').addEventListener('click', ()=>{ lang='en'; localStorage.setItem('btl_lang', 'en'); applyLanguage(); });
document.getElementById('zhBtn').addEventListener('click', ()=>{ lang='zh'; localStorage.setItem('btl_lang', 'zh'); applyLanguage(); });
applyLanguage();

/* ============
   Points, tiers, recent
   ============ */
const POINTS_KEY = 'btl_points_full_v1';
const RECENT_KEY = 'btl_recent_full_v1';
if(!localStorage.getItem(POINTS_KEY)) localStorage.setItem(POINTS_KEY,'0');
function getPoints(){ return Number(localStorage.getItem(POINTS_KEY) || 0); }
function setPoints(v){ localStorage.setItem(POINTS_KEY, String(v)); renderPoints(); }
function addPoints(n){ setPoints(Math.max(0, getPoints() + n)); showFloatingPoints(n); if(n!==0) pushRecent(n); }
function pushRecent(n){ const arr = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); arr.unshift({t:Date.now(), pts:n}); localStorage.setItem(RECENT_KEY, JSON.stringify(arr.slice(0,50))); renderRecent(); }

const TIERS = [
  {name:'Chill', min:0},
  {name:'Bronze', min:1000},
  {name:'Silver', min:1500},
  {name:'Gold', min:2000},
  {name:'Diamond', min:2500},
  {name:'Legendary', min:3000},
  {name:'Wizard', min:3500},
  {name:'King', min:5000},
  {name:'Master', min:8000},
  {name:'Hero', min:12000},
  {name:'Titan', min:16000},
  {name:'Magical Mathematician', min:20000}
];

function getTier(points){
  let cur = TIERS[0];
  for(const t of TIERS) if(points >= t.min) cur = t;
  const next = TIERS.find(t => t.min > points) || null;
  return {current: cur, next};
}

function renderPoints(){
  document.getElementById('points').textContent = getPoints();
  document.getElementById('profileText').textContent = `${t('profileTitle')}: ${getPoints()} pts`;
  const info = getTier(getPoints());
  document.getElementById('tierText').textContent = `${info.current.name} (${info.current.min}+)`;
  const fillPct = info.next ? Math.min(1, (getPoints() - info.current.min) / (info.next.min - info.current.min)) : 1;
  document.getElementById('tierFill').style.width = `${Math.round(fillPct*100)}%`;
}
function renderRecent(){
  const arr = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]').slice(0,6);
  const el = document.getElementById('recentList');
  if(!arr.length){ el.textContent = lang==='zh' ? '暂无记录' : 'No recent wins'; return; }
  el.innerHTML = arr.map(it => `${new Date(it.t).toLocaleString()}: ${it.pts>0?'+':''}${it.pts} pts`).join('<br>');
}
renderPoints(); renderRecent();

/* Export/Reset */
document.getElementById('exportPoints').addEventListener('click', ()=>{
  const data = {points:getPoints(), recent: JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='btl_export.json'; a.click();
});
document.getElementById('resetPoints').addEventListener('click', ()=> {
  if(confirm(lang==='zh' ? '重置分数和记录？' : 'Reset points and recent?')){ localStorage.removeItem(POINTS_KEY); localStorage.removeItem(RECENT_KEY); setPoints(0); renderRecent(); alert(lang==='zh' ? '已重置' : 'Reset done'); }
});

/* ============
   Visual FX: confetti & fireworks + floating points
   ============ */
const fxCanvas = document.getElementById('fxCanvas');
fxCanvas.width = innerWidth; fxCanvas.height = innerHeight;
const fxCtx = fxCanvas.getContext('2d');
window.addEventListener('resize', ()=>{ fxCanvas.width = innerWidth; fxCanvas.height = innerHeight; });

let particles = [];
function spawnConfetti(x=window.innerWidth/2, y=window.innerHeight/3, count=60){
  for(let i=0;i<count;i++) particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.8)*6,life:80+Math.random()*40,size:3+Math.random()*8,h:Math.random()*360});
}
function spawnFirework(cx,cy,count=80){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, s = 1+Math.random()*5;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:60+Math.random()*60,size:1+Math.random()*3,h:Math.random()*360});
  }
}
function celebrateAt(cx=window.innerWidth/2, cy=window.innerHeight/3){
  for(let i=0;i<5;i++) setTimeout(()=> spawnFirework(cx + (Math.random()-0.5)*200, cy + (Math.random()-0.5)*120, 90), i*260);
  spawnConfetti();
}
function fxLoop(){
  fxCtx.clearRect(0,0,fxCanvas.width, fxCanvas.height);
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life--;
    fxCtx.beginPath();
    fxCtx.fillStyle = `hsl(${p.h} 80% 60% / ${Math.max(0,p.life/120)})`;
    fxCtx.arc(p.x,p.y,p.size,0,Math.PI*2); fxCtx.fill();
    if(p.life<=0) particles.splice(i,1);
  }
  requestAnimationFrame(fxLoop);
}
fxLoop();

function showFloatingPoints(n){
  const p = document.createElement('div'); p.textContent = (n>0? '+'+n: String(n));
  p.style.position='fixed'; p.style.left = (window.innerWidth/2) + 'px'; p.style.top = (window.innerHeight/3) + 'px';
  p.style.padding='6px 10px'; p.style.borderRadius='999px'; p.style.background = '#ffd27a'; p.style.fontWeight='800'; p.style.transition='transform 900ms,opacity 900ms'; p.style.zIndex=2000;
  document.body.appendChild(p);
  requestAnimationFrame(()=> p.style.transform='translate(-50%,-120%) scale(1.06)');
  setTimeout(()=> {
    const target = document.querySelector('.points').getBoundingClientRect();
    const dx = (target.left + target.width/2) - window.innerWidth/2;
    const dy = (target.top + target.height/2) - window.innerHeight/3;
    p.style.transform = `translate(${dx}px, ${dy}px) scale(.38)`;
    p.style.opacity = '0';
    setTimeout(()=> p.remove(), 950);
  }, 600);
}

/* ============
   Tiles (home) and in-place embedded games
   ============
   All games are embedded inside tiles. Play opens the area, Close hides it.
   We wire each tile to an initializer that creates the game's UI once.
   ============ */

const tiles = [
  {id:'trivia', title_en:'Trivia (100 levels)', title_zh:'问答（100级）', desc_en:'Arithmetic-only trivia — 10 questions per round; 5s per question.', desc_zh:'纯算术问答 — 每轮10题，每题5秒。'},
  {id:'rapid', title_en:'Rapid Fire', title_zh:'速答', desc_en:'Timed quick rounds.', desc_zh:'限时快速答题。'},
  {id:'maze', title_en:'Math Maze', title_zh:'数学迷宫', desc_en:'Solve gate puzzles to progress.', desc_zh:'通过答题打开迷宫路障。'},
  {id:'pattern', title_en:'Pattern Builder', title_zh:'数列挑战', desc_en:'Complete sequences.', desc_zh:'完成数列。'},
  {id:'prob', title_en:'Probability Cups', title_zh:'概率杯子', desc_en:'Choose highest expected value.', desc_zh:'选择期望值最高的杯子。'},
  {id:'casino', title_en:'Casino', title_zh:'赌场', desc_en:'Slots, secret cups, jackpot.', desc_zh:'老虎机、神秘杯、累积奖金。'},
  {id:'cups', title_en:'Secret Cups', title_zh:'神秘杯', desc_en:'Red-cup shuffle challenge.', desc_zh:'红杯洗牌挑战。'},
  {id:'air', title_en:'Air Hockey', title_zh:'气垫球', desc_en:'Mini air hockey with treasure questions.', desc_zh:'迷你气垫球，进球触发宝藏题目。'}
];

function renderTiles(){
  const cont = document.getElementById('tilesContainer');
  cont.innerHTML = '';
  tiles.forEach(t => {
    const div = document.createElement('div'); div.className = 'tile';
    const title = (lang==='zh') ? t.title_zh : t.title_en;
    const desc = (lang==='zh') ? t.desc_zh : t.desc_en;
    div.innerHTML = `
      <h3>${title}</h3>
      <div class="small">${desc}</div>
      <div class="playWrap">
        <button class="btn" data-action="play" data-game="${t.id}">${t.id==='trivia' ? t.id : (lang==='zh' ? '开始' : 'Play')}</button>
        <button class="btn secondary" data-action="close" data-game="${t.id}">${lang==='zh' ? '关闭' : 'Close'}</button>
        <div style="flex:1"></div>
        <div class="small" id="status-${t.id}">${lang==='zh' ? '就绪' : 'Ready'}</div>
      </div>
      <div class="gameArea" id="area-${t.id}"></div>
    `;
    cont.appendChild(div);
  });
}
renderTiles();

/* Delegated play/close */
document.getElementById('tilesContainer').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const action = btn.dataset.action, game = btn.dataset.game;
  if(action === 'play') openGame(game);
  if(action === 'close') closeGame(game);
});

function openGame(id){
  const area = document.getElementById('area-'+id); if(!area) return;
  area.classList.add('show');
  if(area.dataset.inited) return;
  area.dataset.inited = '1';
  initGame(id, area);
  document.getElementById('status-'+id).textContent = (lang==='zh' ? '正在进行' : 'Playing');
}
function closeGame(id){
  const area = document.getElementById('area-'+id); if(!area) return;
  area.classList.remove('show');
  document.getElementById('status-'+id).textContent = (lang==='zh' ? '就绪' : 'Ready');
}

/* ============
   Game initializers (one-per-game)
   ============ */

function initGame(id, area){
  if(id === 'trivia') initTrivia(area);
  else if(id === 'rapid') initRapid(area);
  else if(id === 'maze') initMaze(area);
  else if(id === 'pattern') initPattern(area);
  else if(id === 'prob') initProb(area);
  else if(id === 'casino') initCasino(area);
  else if(id === 'cups') initCups(area);
  else if(id === 'air') initAir(area);
}

/* ---------- TRIVIA (100 arithmetic levels, 5s per question) ---------- */
function initTrivia(area){
  area.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center">
      <label>${t('triviaLevel')} <select id="tile-trivia-level"></select></label>
      <button id="tile-trivia-start" class="btn">${t('triviaStart')}</button>
      <div style="flex:1"></div>
      <div class="small">${t('timerNote')}</div>
    </div>
    <div id="tile-trivia-ui" style="margin-top:10px"></div>
  `;
  const sel = area.querySelector('#tile-trivia-level');
  for(let i=1;i<=100;i++){ const o=document.createElement('option'); o.value=i; o.text= (lang==='zh' ? '等级 ' : 'Level ') + i; sel.appendChild(o); }
  area.querySelector('#tile-trivia-start').addEventListener('click', ()=>{
    const level = Number(sel.value||1);
    startTileTrivia(level, area.querySelector('#tile-trivia-ui'));
  });
}

let tileTriviaTimer = null;
function startTileTrivia(level, container){
  const questions = [];
  for(let i=0;i<10;i++) questions.push(genArithmeticQuestion(level + Math.floor(i/3)));
  let idx=0, score=0;
  function render(){
    clearTileTriviaTimer();
    container.innerHTML = '';
    if(idx >= questions.length){
      const wrap = document.createElement('div'); wrap.innerHTML = `<div style="font-weight:800">${lang==='zh' ? '回合完成' : 'Round complete'}</div><div class="small">${lang==='zh' ? '得分' : 'Score'}: ${score}/${questions.length}</div>`;
      container.appendChild(wrap);
      if(score >= 7){
        const pts = Math.max(25, Math.round(30 + level * 1.2));
        addPoints(pts);
        celebrateAt();
        container.appendChild(Object.assign(document.createElement('div'), {className:'small', textContent: (lang==='zh' ? '奖励 ' : 'Awarded ') + pts + ' pts'}));
      } else {
        container.appendChild(Object.assign(document.createElement('div'), {className:'small', textContent: lang==='zh' ? '未通过 — 请重试' : 'Failed — try again'}));
      }
      return;
    }
    const q = questions[idx];
    const qdiv = document.createElement('div');
    qdiv.innerHTML = `<div class="question">${lang==='zh' ? '题 ' : 'Q'}${idx+1}: ${q.q}</div>`;
    const answrap = document.createElement('div'); answrap.className='answers';
    q.choices.forEach(choice=>{
      const b = document.createElement('button'); b.className='ans-btn'; b.textContent = choice;
      b.onclick = ()=> { clearTileTriviaTimer(); finalize(choice); };
      answrap.appendChild(b);
    });
    qdiv.appendChild(answrap);
    const timerEl = document.createElement('div'); timerEl.className='small'; timerEl.textContent = (lang==='zh' ? '剩余时间: 5.0s' : 'Time left: 5.0s');
    container.appendChild(qdiv); container.appendChild(timerEl);
    // start 5s countdown
    let t = 5.0;
    tileTriviaTimer = setInterval(()=> {
      t = Math.max(0, t - 0.1);
      timerEl.textContent = (lang==='zh' ? '剩余时间: ' : 'Time left: ') + t.toFixed(1) + 's';
      if(t <= 0){
        clearTileTriviaTimer();
        finalize(null, true);
      }
    }, 100);
    function finalize(choice, timedOut=false){
      // mark correct / incorrect visually
      Array.from(answrap.children).forEach(ch => {
        ch.disabled = true;
        if(ch.textContent === String(q.answer)) ch.classList.add('correct');
      });
      if(!timedOut && choice && String(choice) === String(q.answer)){
        score++;
        // immediate small points per correct
        addPoints(8);
        spawnConfetti();
      }
      setTimeout(()=> { idx++; render(); }, 700);
    }
  }
  render();
}
function clearTileTriviaTimer(){ if(tileTriviaTimer){ clearInterval(tileTriviaTimer); tileTriviaTimer = null; } }

/* Arithmetic generator for 100 levels */
function genArithmeticQuestion(level){
  level = Math.max(1, Math.min(100, Math.round(level)));
  if(level <= 10){
    const a = randInt(1,10), b = randInt(1,10);
    return {q:`${a} + ${b} = ?`, choices: shuffle([String(a+b), String(a+b+1), String(Math.abs(a-b)), String(a*b)]), answer:String(a+b)};
  } else if(level <= 30){
    const a = randInt(2,15), b = randInt(2,12);
    return {q:`${a} × ${b} = ?`, choices: shuffle([String(a*b), String(a*b+randInt(1,5)), String(a*b-randInt(1,5)), String(a+b)]), answer:String(a*b)};
  } else if(level <= 55){
    const a = randInt(10,200), b = randInt(2,12);
    return {q:`${a} ÷ ${b} = ? (nearest int)`, choices: shuffle([String(Math.round(a/b)), String(Math.floor(a/b)), String(Math.ceil(a/b)), String(Math.round((a+b)/b))]), answer:String(Math.round(a/b))};
  } else if(level <= 75){
    const a = randInt(2,9), b = randInt(2,6);
    return {q:`What is ${a}^${b}?`, choices: shuffle([String(Math.pow(a,b)), String(Math.pow(a,b)+randInt(1,20)), String(Math.pow(a,b)-randInt(1,20)), String(Math.pow(a+1,b))]), answer:String(Math.pow(a,b))};
  } else if(level <= 90){
    const a = randInt(10,80), b = randInt(2,12), c = randInt(1,10);
    const val = a + b*c;
    return {q:`${a} + ${b} × ${c} = ?`, choices: shuffle([String(val), String(val+1), String(val-1), String(a*b+c)]), answer:String(val)};
  } else {
    const a = randInt(1,12), b = randInt(1,12), c = randInt(1,10);
    const val = (a*b + c)/a;

/* ---------- MAZE (in-tile) ---------- */
function initMaze(area){
  area.innerHTML = `<div style="display:flex;gap:8px;align-items:center"><button id="tile-maze-gen" class="btn">${lang==='zh' ? '生成迷宫' : 'Generate Maze'}</button><div style="flex:1"></div><div class="small">${lang==='zh' ? '使用方向键移动' : 'Use arrow keys to move'}</div></div><div id="tile-maze-canvas" style="margin-top:10px"></div>`;
  area.querySelector('#tile-maze-gen').addEventListener('click', ()=> {
    const container = area.querySelector('#tile-maze-canvas'); container.innerHTML = '';
    const size = 360; const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size; container.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const m = makeMazeGrid(15,15);
    let cell = Math.floor(size / m.w);
    const state = {m, px:1, py:1, solved:0};
    draw();
    function draw(){
      ctx.clearRect(0,0,canvas.width, canvas.height); ctx.fillStyle='#eef6ff'; ctx.fillRect(0,0,canvas.width, canvas.height);
      for(let y=0;y<m.h;y++) for(let x=0;x<m.w;x++){
        const v = m.grid[y][x]; const px = x*cell, py = y*cell;
        if(v===1){ ctx.fillStyle='#133'; ctx.fillRect(px,py,cell,cell); }
        else if(v===2){ ctx.fillStyle='#ffd'; ctx.fillRect(px,py,cell,cell); ctx.fillStyle='#6a3bdb'; ctx.fillRect(px+cell*0.2,py+cell*0.2,cell*0.6,cell*0.6); }
        else ctx.fillStyle='#f7fff7', ctx.fillRect(px,py,cell,cell);
      }
      ctx.fillStyle='#1a73e8'; ctx.beginPath(); ctx.arc((state.px+0.5)*cell,(state.py+0.5)*cell,cell*0.28,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff9'; ctx.fillRect(m.exit.x*cell+cell*0.15, m.exit.y*cell+cell*0.15, cell*0.7, cell*0.7);
    }
    function move(dx,dy){
      const nx = state.px + dx, ny = state.py + dy; if(nx<0||ny<0||nx>=m.w||ny>=m.h) return; const val = m.grid[ny][nx];
      if(val === 1) return;
      if(val === 2){
        const q = genArithmeticQuestion(randInt(1,40));
        const ans = prompt((lang==='zh' ? '闸门题: ' : 'Gate question: ') + q.q + '\n' + q.choices.join(' | '));
        if(ans === null) return;
        if(String(ans).trim() === String(q.answer)){ m.grid[ny][nx] = 0; state.solved++; addPoints(10); draw(); } else { alert(lang==='zh' ? '错误' : 'Wrong'); return; }
      } else { state.px = nx; state.py = ny; }
      draw();
      if(state.px === m.exit.x && state.py === m.exit.y){ const pts = 80 + state.solved*10; addPoints(pts); celebrateAt(); alert((lang==='zh' ? '到达中心! +' : 'Reached center! +') + pts + ' pts'); document.removeEventListener('keydown', keyHandler); }
    }
    function keyHandler(e){
      if(e.key==='ArrowUp' || e.key==='w') move(0,-1);
      if(e.key==='ArrowDown' || e.key==='s') move(0,1);
      if(e.key==='ArrowLeft' || e.key==='a') move(-1,0);
      if(e.key==='ArrowRight' || e.key==='d') move(1,0);
    }
    document.addEventListener('keydown', keyHandler);
    function makeMazeGrid(cols, rows){
      if(cols%2===0) cols++; if(rows%2===0) rows++;
      const grid = Array.from({length:rows}, ()=>Array(cols).fill(1));
      for(let y=1;y<rows;y+=2) for(let x=1;x<cols;x+=2) grid[y][x]=0;
      function neigh(x,y){ const n=[]; if(y-2>0) n.push([x,y-2]); if(y+2<rows-1) n.push([x,y+2]); if(x-2>0) n.push([x-2,y]); if(x+2<cols-1) n.push([x+2,y]); return n; }
      const stack=[[1,1]], visited=new Set(['1,1']);
      while(stack.length){
        const [cx,cy] = stack[stack.length-1]; const opts = neigh(cx,cy).filter(n=> !visited.has(n.join(',')));
        if(opts.length){ const n = opts[Math.floor(Math.random()*opts.length)]; const wx=(cx+n[0])/2, wy=(cy+n[1])/2; grid[wy][wx]=0; visited.add(n.join(',')); stack.push(n); } else stack.pop();
      }
      // gates
      for(let g=0; g<8; g++){
        let placed=false;
        for(let tries=0; tries<200 && !placed; tries++){
          const gx = randInt(1,cols-2), gy = randInt(1,rows-2);
          if(grid[gy][gx]===1){
            const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
            if(dirs.some(d=> grid[gy+d[1]][gx+d[0]]===0)){ grid[gy][gx]=2; placed=true; }
          }
        }
      }
      let ex=cols-2, ey=rows-2; while(grid[ey][ex]!==0){ ex--; if(ex<1){ ex=cols-2; ey--; if(ey<1) break; } }
      return {grid, w:cols, h:rows, exit:{x:ex,y:ey}};
    }
  });
}

function generatePattern(level){
  level = Math.max(1, Math.min(30, level));
  const types = ['arithmetic','geometric','fib-like','alternating','squares'];
  const t = types[level % types.length];
  if(t==='arithmetic'){ const a=randInt(1,6), d=randInt(1,8); const seq=[a,a+d,a+2*d,a+3*d,a+4*d]; return {seq, next:a+5*d, type:`Arithmetic +${d}`}; }
  if(t==='geometric'){ const a=randInt(1,4), r=randInt(2,4); const seq=[a,a*r,a*r*r,a*r*r*r,a*r*r*r*r]; return {seq,next:a*Math.pow(r,5), type:`Geometric x${r}`}; }
  if(t==='fib-like'){ const a=randInt(1,5), b=randInt(1,6); const seq=[a,b,a+b,b+(a+b),(a+b)+(b+(a+b))]; return {seq,next: seq[3]+seq[4], type:'Fib-like'}; }
  if(t==='alternating'){ const a=randInt(1,6), b=randInt(7,12); const seq=[a,b,a+b,a+2*b,a+3*b]; return {seq,next:a+4*b, type:'Alternating'}; }
  const s=randInt(1,6); return {seq:[s,s+1,s+4,s+9,s+16], next: s+25, type:'Squares'};
}

  function initMatch(){
    state = {pY:canvas.height/2, aY:canvas.height/2, puck:{x:canvas.width/2,y:canvas.height/2,vx:3,vy:2,r:6}, sP:0, sA:0, running:false, sonar:[]};
    canvas.onmousemove = (e)=>{ const r=canvas.getBoundingClientRect(); state.pY = Math.max(12, Math.min(canvas.height-12, e.clientY - r.top)); };
    function loop(){ requestAnimationFrame(loop); if(!state) return; if(state.running){ state.puck.x += state.puck.vx; state.puck.y += state.puck.vy; if(state.puck.y <= state.puck.r || state.puck.y >= canvas.height - state.puck.r) state.puck.vy *= -1; const dx = state.puck.x - 20, dy = state.puck.y - state.pY; if(Math.hypot(dx,dy) < state.puck.r + 12 && state.puck.vx < 0){ state.puck.vx = Math.abs(state.puck.vx)+0.8; state.puck.vy += dy*0.05; } const dx2 = state.puck.x - (canvas.width-20), dy2 = state.puck.y - state.aY; if(Math.hypot(dx2,dy2) < state.puck.r + 12 && state.puck.vx > 0){ state.puck.vx = -Math.abs(state.puck.vx)-0.8; state.puck.vy += dy2*0.05; } state.aY += (state.puck.y - state.aY)*0.05; if(state.puck.x < 0){ state.sA++; resetP(); triggerSonar(); } if(state.puck.x > canvas.width){ state.sP++; resetP(); triggerSonar(); } } draw(); }
    function resetP(){ state.puck.x = canvas.width/2; state.puck.y = canvas.height/2; state.puck.vx = (Math.random()>0.5?3:-3); state.puck.vy = (Math.random()-0.5)*3; }
    function triggerSonar(){ const tx = randInt(40, canvas.width-40), ty = randInt(20, canvas.height-20); const q = genArithmeticQuestion(randInt(10,60)); state.sonar.push({x:tx,y:ty,r:10,q}); setTimeout(()=>{ const ans = prompt((lang==='zh' ? '宝藏题：' : 'Treasure! Solve: ') + q.q + '\n' + q.choices.join(' | ')); if(ans !== null && String(ans).trim() === String(q.answer)){ addPoints(40); celebrateAt(); alert((lang==='zh' ? '正确！ +40 积分' : 'Correct! +40 pts')); } else alert(lang==='zh' ? '错误或已取消' : 'Incorrect or cancelled'); }, 900); }
    function draw(){ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#e6fbff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#1a73e8'; ctx.fillRect(12, state.pY-18, 8, 36); ctx.fillStyle='#ff6b6b'; ctx.fillRect(canvas.width-20, state.aY-18, 8, 36); ctx.fillStyle='#06263a'; ctx.beginPath(); ctx.arc(state.puck.x,state.puck.y,state.puck.r,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#072033'; ctx.font='14px Inter'; ctx.fillText(state.sP + ' - ' + state.sA, canvas.width/2 - 12, 16); } loop();
  }
}

/* ============
   Utilities & helpers
   ============ */
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function rand(a,b){ return randInt(a,b); }
function shuffle(arr){ const r = arr.slice(); for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i], r[j]]=[r[j], r[i]]; } return r; }
function genArithmeticQuestion(level){ level = Math.max(1, Math.min(100, Math.round(level))); if(level<=10){ const a=randInt(1,10), b=randInt(1,10); return {q:`${a} + ${b} = ?`, choices: shuffle([String(a+b), String(a+b+1), String(Math.abs(a-b)), String(a*b)]), answer:String(a+b)}; } else if(level<=30){ const a=randInt(2,15), b=randInt(2,12); return {q:`${a} × ${b} = ?`, choices: shuffle([String(a*b), String(a*b+randInt(1,5)), String(a*b-randInt(1,5)), String(a+b)]), answer:String(a*b)}; } else if(level<=55){ const a=randInt(10,200), b=randInt(2,12); return {q:`${a} ÷ ${b} = ? (nearest int)`, choices: shuffle([String(Math.round(a/b)), String(Math.floor(a/b)), String(Math.ceil(a/b)), String(Math.round((a+b)/b))]), answer:String(Math.round(a/b))}; } else if(level<=75){ const a=randInt(2,9), b=randInt(2,6); return {q:`What is ${a}^${b}?`, choices: shuffle([String(Math.pow(a,b)), String(Math.pow(a,b)+randInt(1,20)), String(Math.pow(a,b)-randInt(1,20)), String(Math.pow(a+1,b))]), answer:String(Math.pow(a,b))}; } else if(level<=90){ const a=randInt(10,80), b=randInt(2,12), c=randInt(1,10); const val=a + b*c; return {q:`${a} + ${b} × ${c} = ?`, choices: shuffle([String(val), String(val+1), String(val-1), String(a*b+c)]), answer:String(val)}; } else { const a=randInt(1,12), b=randInt(1,12), c=randInt(1,10); const val=(a*b + c)/a; return {q:`Solve: ${a}x - ${c} = ${a*b}. x = ?`, choices: shuffle([String(val), String(Math.floor(val)), String(Math.ceil(val)), String(b)]), answer:String(val)}; } }
function generateMathQuestion(l){ return genArithmeticQuestion(l); }
function randIntAlias(a,b){ return randInt(a,b); }

/* Helper wrappers reused */
function celebrateConfetti(){ spawnConfetti(); }

/* initial render of tiles & language */
applyLanguage();
renderTiles();
renderPoints();
