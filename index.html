<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BREAK THE LOGIC — Math Hub (Fixed Home)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6fbff; --card:#ffffff; --accent:#1a73e8; --muted:#5b6b86;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:#072033}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid rgba(7,32,51,0.06)}
  .brand{font-weight:800;font-size:20px}
  .controls{display:flex;gap:10px;align-items:center}
  .points{background:linear-gradient(90deg,#fff,#f3fbff);padding:8px 12px;border-radius:10px;border:1px solid rgba(7,32,51,0.04);font-weight:700}
  main{padding:16px 20px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .tile{background:var(--card);border-radius:10px;padding:12px;border:1px solid rgba(7,32,51,0.06);min-height:120px;position:relative}
  .tile h3{margin:0 0 6px 0;font-size:16px}
  .small{font-size:13px;color:var(--muted)}
  .playRow{display:flex;gap:8px;align-items:center;margin-top:10px}
  .btn{background:var(--accent);color:white;padding:8px 10px;border-radius:8px;border:0;cursor:pointer;font-weight:700}
  .btn.secondary{background:transparent;border:1px solid rgba(7,32,51,0.08);color:#072033}
  .gameArea{margin-top:10px;border-top:1px dashed rgba(7,32,51,0.04);padding-top:10px;display:none}
  .gameArea.show{display:block}
  .answers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
  .ans-btn{padding:10px;border-radius:8px;border:1px solid rgba(7,32,51,0.06);background:#fff;cursor:pointer;font-weight:700}
  canvas{width:100%;height:auto;border-radius:8px;background:#f7fbff;border:1px solid rgba(7,32,51,0.04)}
  /* fireworks canvas behind but still pointer-events none */
  #fxCanvas{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:999}
  @media(max-width:900px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="brand">BREAK THE LOGIC — Math Hub</div>
  <div class="controls">
    <div class="points">Points: <span id="points">0</span></div>
    <button class="btn secondary" id="resetBtn">Reset</button>
  </div>
</header>

<main>
  <div class="grid" id="tilesGrid">
    <!-- Tiles will be created by script -->
  </div>
</main>

<canvas id="fxCanvas"></canvas>

<script>
/*
  Simplified, robust single-file app.
  All games are embedded in tiles on the home page.
  Play/Close buttons work in-place.
*/

/* Storage & points */
const POINTS_KEY = 'btl_points_fixed_home_v1';
if(!localStorage.getItem(POINTS_KEY)) localStorage.setItem(POINTS_KEY,'0');
function getPoints(){ return Number(localStorage.getItem(POINTS_KEY) || 0); }
function setPoints(v){ localStorage.setItem(POINTS_KEY, String(v)); renderPoints(); }
function addPoints(n){ setPoints(Math.max(0, getPoints() + n)); showFloatingPoints(n); }
function renderPoints(){ document.getElementById('points').textContent = getPoints(); }
renderPoints();

document.getElementById('resetBtn').addEventListener('click', ()=> {
  if(confirm('Reset points?')){ localStorage.removeItem(POINTS_KEY); localStorage.setItem(POINTS_KEY,'0'); renderPoints(); alert('Reset done'); }
});

/* small fireworks/confetti visual (non-blocking) */
const fxCanvas = document.getElementById('fxCanvas'); fxCanvas.width = innerWidth; fxCanvas.height = innerHeight; const fxCtx = fxCanvas.getContext('2d');
window.addEventListener('resize', ()=>{ fxCanvas.width = innerWidth; fxCanvas.height = innerHeight; });
let particles = [];
function spawnConfetti(x=window.innerWidth/2, y=window.innerHeight/3, count=60){
  for(let i=0;i<count;i++) particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.8)*6,life:80+Math.random()*40,size:3+Math.random()*8,h:Math.random()*360});
}
function spawnFirework(x,y,count=80){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, s = 1+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:80+Math.random()*60,size:1+Math.random()*3,h:Math.random()*360});
  }
}
function celebrate(){
  const cx = innerWidth/2, cy = innerHeight/3;
  for(let i=0;i<5;i++) setTimeout(()=> spawnFirework(cx + (Math.random()-0.5)*200, cy + (Math.random()-0.5)*120, 80), i*280);
  spawnConfetti();
}
function fxLoop(){
  fxCtx.clearRect(0,0,fxCanvas.width, fxCanvas.height);
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life--;
    fxCtx.fillStyle = `hsl(${p.h} 80% 60% / ${Math.max(0, p.life/120)})`;
    if(p.size > 6) fxCtx.fillRect(p.x,p.y,p.size,p.size); else { fxCtx.beginPath(); fxCtx.arc(p.x,p.y,p.size,0,Math.PI*2); fxCtx.fill(); }
    if(p.life <= 0) particles.splice(i,1);
  }
  requestAnimationFrame(fxLoop);
}
fxLoop();

/* floating points popup like Gimkit */
function showFloatingPoints(n){
  const popup = document.createElement('div'); popup.textContent = (n>0? '+'+n : String(n)); popup.style.position='fixed';
  const startX = window.innerWidth/2; const startY = window.innerHeight/3;
  popup.style.left = startX + 'px'; popup.style.top = startY + 'px';
  popup.style.padding = '6px 10px'; popup.style.borderRadius='999px'; popup.style.background = '#ffd27a'; popup.style.fontWeight = '800';
  popup.style.transform = 'translate(-50%,-50%)'; popup.style.transition = 'transform 900ms cubic-bezier(.2,.9,.2,1), opacity 900ms';
  popup.style.zIndex = 2000;
  document.body.appendChild(popup);
  requestAnimationFrame(()=> popup.style.transform = 'translate(-50%,-120%) scale(1.05)');
  setTimeout(()=> {
    const target = document.querySelector('.points').getBoundingClientRect();
    const dx = (target.left + target.width/2) - startX;
    const dy = (target.top + target.height/2) - startY;
    popup.style.transform = `translate(${dx}px, ${dy}px) scale(.4)`;
    popup.style.opacity = '0';
    setTimeout(()=> popup.remove(), 950);
  }, 600);
}

/* Tiles spec */
const tilesSpec = [
  {id:'trivia', title:'Trivia (50 levels)', desc:'10-question rounds. Pass 7/10.'},
  {id:'rapid', title:'Rapid Fire', desc:'Timed speed rounds.'},
  {id:'maze', title:'Math Maze', desc:'Gates require a math answer.'},
  {id:'pattern', title:'Pattern Builder', desc:'Continue number sequences.'},
  {id:'prob', title:'Probability Cups', desc:'Choose highest EV.'},
  {id:'casino', title:'Casino', desc:'Slots, Secret Cups, Jackpot.'},
  {id:'cups', title:'Secret Cups', desc:'Red cups shuffle challenge.'},
  {id:'air', title:'Air Hockey', desc:'Simple air hockey with treasure Qs.'}
];

/* Create tiles and basic UI placeholders */
const grid = document.getElementById('tilesGrid');
tilesSpec.forEach(spec => {
  const tile = document.createElement('div'); tile.className = 'tile'; tile.id = 'tile-' + spec.id;
  tile.innerHTML = `
    <h3>${spec.title}</h3>
    <div class="small">${spec.desc}</div>
    <div class="playRow">
      <button class="btn" data-action="play" data-game="${spec.id}">Play</button>
      <button class="btn secondary" data-action="close" data-game="${spec.id}">Close</button>
      <div style="flex:1"></div>
      <div class="small" id="status-${spec.id}">Ready</div>
    </div>
    <div class="gameArea" id="area-${spec.id}"></div>
  `;
  grid.appendChild(tile);
});

/* Delegated click listeners for Play/Close */
grid.addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const action = btn.dataset.action, game = btn.dataset.game;
  if(action === 'play') openGameInline(game);
  if(action === 'close') closeGameInline(game);
});

/* Open/close in-place and initialize once */
function openGameInline(id){
  const area = document.getElementById('area-' + id); if(!area) return;
  area.classList.add('show');
  if(area.dataset.inited) return;
  area.dataset.inited = '1';
  initializeGame(id, area);
  document.getElementById('status-' + id).textContent = 'Playing';
}
function closeGameInline(id){
  const area = document.getElementById('area-' + id); if(!area) return;
  area.classList.remove('show');
  document.getElementById('status-' + id).textContent = 'Ready';
}

/* Basic game initializers (robust, minimal) */
function initializeGame(id, area){
  if(id === 'trivia') initTrivia(area);
  else if(id === 'rapid') initRapid(area);
  else if(id === 'maze') initMaze(area);
  else if(id === 'pattern') initPattern(area);
  else if(id === 'prob') initProb(area);
  else if(id === 'casino') initCasino(area);
  else if(id === 'cups') initCups(area);
  else if(id === 'air') initAir(area);
}

/* Trivia: small embedded UI */
function initTrivia(area){
  area.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center">
      <label>Level: <select id="trivia-level"></select></label>
      <button id="trivia-start" class="btn">Start</button>
      <div style="flex:1"></div>
      <div class="small">Pass 7/10 to advance (auto points).</div>
    </div>
    <div id="trivia-ui" style="margin-top:10px"></div>
  `;
  const sel = area.querySelector('#trivia-level');
  for(let i=1;i<=50;i++){ const o=document.createElement('option'); o.value=i; o.text='Level '+i; sel.appendChild(o); }
  area.querySelector('#trivia-start').addEventListener('click', ()=> {
    const level = Number(sel.value);
    runTriviaRound(level, area.querySelector('#trivia-ui'));
  });
}
function runTriviaRound(level, container){
  const questions = []; for(let i=0;i<10;i++) questions.push(generateMathQuestion(level + Math.floor(i/4)));
  let idx=0, score=0;
  function render(){
    container.innerHTML = '';
    if(idx >= questions.length){
      container.innerHTML = `<div style="font-weight:800">Round complete</div><div class="small">Score: ${score}/10</div>`;
      if(score >= 7){ const pts = Math.max(25, Math.round(30 + level*1.5)); addPoints(pts); celebrate(); container.innerHTML += `<div class="small">Passed +${pts} pts</div>`; }
      else { container.innerHTML += `<div class="small">Failed — try again</div>`; }
      return;
    }
    const q = questions[idx];
    const qdiv = document.createElement('div'); qdiv.innerHTML = `<div class="question">Q${idx+1}: ${q.q}</div>`;
    const answers = document.createElement('div'); answers.className='answers';
    q.choices.forEach(choice=>{
      const b = document.createElement('button'); b.className='ans-btn'; b.textContent = choice;
      b.onclick = ()=>{
        Array.from(answers.children).forEach(ch=> ch.disabled=true);
        if(choice === q.answer){ b.style.background = '#bff6d9'; const r=b.getBoundingClientRect(); addPoints(10); score++; spawnConfetti(); }
        else b.style.background = '#ffd6d6';
        Array.from(answers.children).forEach(ch=> { if(ch.textContent === q.answer) ch.style.border='2px solid #08c27b'; });
        setTimeout(()=> { idx++; render(); }, 600);
      };
      answers.appendChild(b);
    });
    qdiv.appendChild(answers); container.appendChild(qdiv);
  }
  render();
}

/* Rapid: minimal */
function initRapid(area){
  area.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center">
      <label>Difficulty:
        <select id="rapid-diff"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select>
      </label>
      <button id="rapid-start" class="btn">Start</button>
      <div style="flex:1"></div>
      <div class="small">Timed quick questions</div>
    </div>
    <div id="rapid-ui" style="margin-top:10px"></div>
  `;
  area.querySelector('#rapid-start').addEventListener('click', ()=> {
    const diff = area.querySelector('#rapid-diff').value;
    runRapid(area.querySelector('#rapid-ui'), diff);
  });
}
function runRapid(container, diff){
  const timePer = diff==='easy'?6: diff==='medium'?4:2.5;
  const questions = Array.from({length:12}, ()=> generateMathQuestion(randInt(1,45)));
  let idx=0, score=0, timer=null;
  function render(){
    container.innerHTML = '';
    if(idx >= questions.length){
      const pts = score*8; addPoints(pts); container.innerHTML = `<div class="small">Done ${score}/${questions.length} +${pts} pts</div>`; if(score >= Math.ceil(questions.length*0.6)) celebrate();
      return;
    }
    const q = questions[idx];
    const qdiv = document.createElement('div'); qdiv.innerHTML = `<div class="question">Q${idx+1}: ${q.q}</div><div class="small">Time: <span id="rapidTime">${timePer.toFixed(1)}</span>s</div>`;
    const answers = document.createElement('div'); answers.className='answers';
    q.choices.forEach(choice=>{
      const b = document.createElement('button'); b.className='ans-btn'; b.textContent = choice;
      b.onclick = () => { clearInterval(timer); if(choice === q.answer){ score++; addPoints(10); spawnConfetti(); } idx++; render(); };
      answers.appendChild(b);
    });
    qdiv.appendChild(answers); container.appendChild(qdiv);
    let t = timePer; const timeEl = container.querySelector('#rapidTime'); timeEl.textContent = t.toFixed(1);
    timer = setInterval(()=> { t -= 0.1; if(timeEl) timeEl.textContent = t.toFixed(1); if(t <= 0){ clearInterval(timer); idx++; render(); } }, 100);
  }
  render();
}

/* Maze: simple visual with gate prompts */
function initMaze(area){
  const w = 320, h = 320;
  area.innerHTML = `<div style="display:flex;gap:8px;align-items:center"><button id="maze-gen" class="btn">Generate Maze</button><div style="flex:1"></div><div class="small">Use arrow keys to move (gates ask questions)</div></div><canvas id="maze-canvas" width="${w}" height="${h}" style="margin-top:8px"></canvas>`;
  const canvas = area.querySelector('#maze-canvas'); const ctx = canvas.getContext('2d');
  let maze = null, cell = 20, player = {x:1,y:1}, keyListener = null;
  area.querySelector('#maze-gen').addEventListener('click', ()=>{
    maze = makeMaze(15,15); cell = Math.floor(Math.min(w/maze.w, h/maze.h)); player = {x:1,y:1}; draw();
    if(keyListener) document.removeEventListener('keydown', keyListener);
    keyListener = (e)=> {
      const map = {'ArrowUp':[0,-1],'ArrowDown':[0,1],'ArrowLeft':[-1,0],'ArrowRight':[1,0],'w':[0,-1],'s':[0,1],'a':[-1,0],'d':[1,0]};
      const d = map[e.key]; if(!d) return;
      const nx = player.x + d[0], ny = player.y + d[1]; if(nx<0||ny<0||nx>=maze.w||ny>=maze.h) return;
      const cellVal = maze.grid[ny][nx];
      if(cellVal === 1) return; // wall
      if(cellVal === 2){ // gate
        const q = generateMathQuestion(randInt(1,30));
        const ans = prompt(`Gate puzzle: ${q.q}\nChoices: ${q.choices.join(' | ')}`);
        if(ans === null) return;
        if(String(ans).trim() === String(q.answer)){ maze.grid[ny][nx]=0; addPoints(10); draw(); } else { alert('Wrong'); return; }
      } else player.x = nx, player.y = ny;
      draw();
      if(player.x === maze.exit.x && player.y === maze.exit.y){ addPoints(60); celebrate(); alert('Reached exit! +60 pts'); document.removeEventListener('keydown', keyListener); }
    };
    document.addEventListener('keydown', keyListener);
  });
  function draw(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    if(!maze) return;
    for(let y=0;y<maze.h;y++){
      for(let x=0;x<maze.w;x++){
        const v = maze.grid[y][x];
        if(v===1) ctx.fillStyle='#133', ctx.fillRect(x*cell,y*cell,cell,cell);
        else if(v===2) ctx.fillStyle='#b36', ctx.fillRect(x*cell,y*cell,cell,cell);
        else ctx.fillStyle='#f7fff7', ctx.fillRect(x*cell,y*cell,cell,cell);
      }
    }
    ctx.fillStyle='#1a73e8'; ctx.beginPath(); ctx.arc((player.x+0.5)*cell,(player.y+0.5)*cell,cell*0.35,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff9'; ctx.fillRect(maze.exit.x*cell+cell*0.15, maze.exit.y*cell+cell*0.15, cell*0.7, cell*0.7);
  }
  function makeMaze(cols, rows){
    if(cols%2===0) cols++; if(rows%2===0) rows++;
    const g = Array.from({length:rows}, ()=> Array(cols).fill(1));
    for(let y=1;y<rows;y+=2) for(let x=1;x<cols;x+=2) g[y][x]=0;
    function neigh(x,y){ const n=[]; if(y-2>0) n.push([x,y-2]); if(y+2<rows-1) n.push([x,y+2]); if(x-2>0) n.push([x-2,y]); if(x+2<cols-1) n.push([x+2,y]); return n; }
    const stack=[[1,1]], visited=new Set(['1,1']);
    while(stack.length){
      const [cx,cy] = stack[stack.length-1]; const opts = neigh(cx,cy).filter(n=> !visited.has(n.join(',')));
      if(opts.length){ const n = opts[Math.floor(Math.random()*opts.length)]; const wx=(cx+n[0])/2, wy=(cy+n[1])/2; g[wy][wx]=0; visited.add(n.join(',')); stack.push(n); } else stack.pop();
    }
    // place some gates
    for(let i=0;i<6;i++){ let placed=false; for(let t=0;t<300 && !placed;t++){ const gx=randInt(1,cols-2), gy=randInt(1,rows-2); if(g[gy][gx]===1){ const dirs=[[1,0],[-1,0],[0,1],[0,-1]]; if(dirs.some(d=> g[gy+d[1]][gx+d[0]]===0)){ g[gy][gx]=2; placed=true; } } } }
    let ex=cols-2, ey=rows-2; while(g[ey][ex]!==0){ ex--; if(ex<1){ ex=cols-2; ey--; if(ey<1) break; } }
    return {grid:g,w:cols,h:rows, exit:{x:ex,y:ey}};
  }
}

/* Pattern */
function initPattern(area){
  area.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center">
      <label>Level: <select id="pattern-level"></select></label>
      <button id="pattern-start" class="btn">Start</button>
      <div style="flex:1"></div>
      <div class="small">Finish 5 sequences.</div>
    </div>
    <div id="pattern-ui" style="margin-top:10px"></div>
  `;
  const sel = area.querySelector('#pattern-level'); for(let i=1;i<=30;i++){ const o=document.createElement('option'); o.value=i; o.text='Level '+i; sel.appendChild(o); }
  area.querySelector('#pattern-start').addEventListener('click', ()=> startPattern(Number(sel.value), area.querySelector('#pattern-ui')));
}
function startPattern(level, ui){
  let i=0, score=0;
  function next(){
    if(i>=5){ ui.innerHTML = `<div class="small">Completed: ${score}/5</div>`; addPoints(score*15); if(score>=3) celebrate(); return; }
    const p = generatePattern(level + i);
    ui.innerHTML = `<div class="small">Type: ${p.type}</div><div class="question">${p.seq.join(', ')}, ...</div><input id="pat-answer" style="padding:8px;border-radius:6px;border:1px solid #ddd"><button id="pat-submit" class="btn" style="margin-left:6px">Submit</button>`;
    ui.querySelector('#pat-submit').onclick = ()=> {
      const v = ui.querySelector('#pat-answer').value;
      if(String(v) === String(p.next)){ score++; addPoints(15); celebrateConfetti(); } else alert('Wrong — '+p.next);
      i++; next();
    };
  }
  next();
}
function generatePattern(level){
  level = Math.max(1, Math.min(30, level));
  const types = ['arithmetic','geometric','fib-like','alternating','squares'];
  const t = types[level % types.length];
  if(t==='arithmetic'){ const a=randInt(1,6), d=randInt(1,8); return {seq:[a,a+d,a+2*d,a+3*d,a+4*d], next: a+5*d, type:'Arithmetic +'+d}; }
  if(t==='geometric'){ const a=randInt(1,4), r=randInt(2,4); return {seq:[a,a*r,a*r*r,a*r*r*r,a*r*r*r*r], next: a*Math.pow(r,5), type:'Geometric ×'+r}; }
  if(t==='fib-like'){ const a=randInt(1,5), b=randInt(1,6); const seq=[a,b,a+b,b+(a+b),(a+b)+(b+(a+b))]; return {seq, next: seq[3]+seq[4], type:'Fib-like'}; }
  if(t==='alternating'){ const a=randInt(1,6), b=randInt(7,12); const seq=[a,b,a+b,a+2*b,a+3*b]; return {seq, next: a+4*b, type:'Alternating'}; }
  const s=randInt(1,6); return {seq:[s,s+1,s+4,s+9,s+16], next: s+25, type:'Squares offset'};
}

/* Probability */
function initProb(area){
  area.innerHTML = `<div style="display:flex;gap:8px;align-items:center"><button id="prob-start" class="btn">Start</button><div style="flex:1"></div><div class="small">Pick the best EV</div></div><div id="prob-ui" style="margin-top:10px"></div>`;
  area.querySelector('#prob-start').addEventListener('click', ()=> renderProb(area.querySelector('#prob-ui'), generateProbQuestion()));
}
function generateProbQuestion(){
  const base = randInt(5,30); const p1=Math.random()*0.6+0.1, p2=Math.random()*0.6+0.05, p3=Math.random()*0.6+0.02;
  const a1=base+randInt(0,base), a2=base+randInt(0,base+10), a3=base+randInt(0,base+20);
  return {cups:[{label:'A',p:+p1.toFixed(2),payout:a1,ev: +(p1*a1).toFixed(2)},{label:'B',p:+p2.toFixed(2),payout:a2,ev: +(p2*a2).toFixed(2)},{label:'C',p:+p3.toFixed(2),payout:a3,ev: +(p3*a3).toFixed(2)}]};
}
function renderProb(container, q){
  container.innerHTML = `<div class="question">Choose highest expected value</div>`; const row=document.createElement('div'); row.style.display='flex'; row.style.gap='8px';
  q.cups.forEach(c=>{ const el=document.createElement('div'); el.style.flex='1'; el.style.padding='10px'; el.style.border='1px solid #eee'; el.style.borderRadius='8px'; el.style.textAlign='center'; el.innerHTML = `<div style="font-weight:800">${c.label}</div><div class="small">Payout: ${c.payout}</div><div class="small">Chance: ${Math.round(c.p*100)}%</div>`; el.onclick=()=>{ const best=q.cups.reduce((a,b)=> a.ev > b.ev ? a : b); if(c.label === best.label){ addPoints(20); celebrateConfetti(); alert('Correct +20 pts'); } else alert(`Incorrect — best was ${best.label} (EV ${best.ev})`); renderProb(container, generateProbQuestion()); }; row.appendChild(el); });
  container.appendChild(row);
}

/* Casino: simplified embedded UI */
function initCasino(area){
  area.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center">
      <div style="flex:1">

/* Secret cups embedded */
function initCups(area){
  area.innerHTML = `<div class="small">Secret Cups: open via Casino or Play here.</div><div style="margin-top:10px"><button id="cups-start" class="btn">Start Secret Cups</button></div><div id="cups-ui" style="margin-top:8px"></div>`;
  area.querySelector('#cups-start').addEventListener('click', ()=> openCupsEmbedded(area.querySelector('#cups-ui')));
}
function openCupsEmbedded(container){
  container.innerHTML = '';
  const status = document.createElement('div'); status.className='small'; status.textContent = 'Secret Cups — beat 3 levels for 250 pts'; container.appendChild(status);
  startCupsLevel(container,1);
}
function startCupsLevel(container, level){
  // clear previous level area
  let lvlArea = container.querySelector('.level-area');
  if(lvlArea) lvlArea.remove();
  lvlArea = document.createElement('div'); lvlArea.className='level-area'; lvlArea.style.marginTop = '8px'; container.appendChild(lvlArea);
  // create 3 cups
  const cupEls = [];
  let ballIndex = randInt(0,2);
  for(let i=0;i<3;i++){
    const cup = document.createElement('div'); cup.style.display='inline-block'; cup.style.width='90px'; cup.style.height='90px'; cup.style.background='#d33'; cup.style.marginRight='8px'; cup.style.borderRadius='8px'; cup.style.position='relative'; cup.style.cursor='pointer';
    const ball = document.createElement('div'); ball.style.position='absolute'; ball.style.left='50%'; ball.style.bottom='14px'; ball.style.transform='translateX(-50%)'; ball.style.width='22px'; ball.style.height='22px'; ball.style.borderRadius='50%'; ball.style.background='#ffd'; ball.style.opacity=(i===ballIndex)?'1':'0';
    cup.appendChild(ball); lvlArea.appendChild(cup); cupEls.push(cup);
  }
  // hide ball shortly
  setTimeout(()=> cupEls.forEach(c=> c.querySelector('div').style.opacity='0'), 700);
  // shuffle visibly (simple swapping)
  const cfg = level===1?{sh:6,spd:200}: level===2?{sh:12,spd:150}:{sh:20,spd:100};
  (async ()=>{
    await new Promise(r=>setTimeout(r, 600));
    for(let s=0;s<cfg.sh;s++){
      const a = randInt(0,2), b = (a + randInt(1,2))%3;
      // swap elements in DOM for visible effect
      const ca = cupEls[a], cb = cupEls[b];
      const cloneA = ca.cloneNode(true), cloneB = cb.cloneNode(true);
      ca.replaceWith(cloneB); cb.replaceWith(cloneA);
      cupEls[a] = cloneB; cupEls[b] = cloneA;
      await new Promise(r=>setTimeout(r, cfg.spd));
    }
    // allow picks
    const info = document.createElement('div'); info.className='small'; info.textContent = 'Pick a cup!';
    lvlArea.appendChild(info);
    cupEls.forEach((cup, idx)=>{
      cup.onclick = ()=>{
        cupEls.forEach(c=> c.querySelector('div').style.opacity='0');
        cup.querySelector('div').style.opacity='1';
        const revealedIndex = cupEls.findIndex(c=> c.querySelector('div').style.opacity === '1');
        if(revealedIndex === idx){
          if(level < 3){ addPoints(15); spawnConfetti(); setTimeout(()=> startCupsLevel(container, level+1), 800); }
          else { addPoints(250); celebrate(); alert('You beat level 3! +250 pts'); container.innerHTML = '<div class="small">Completed — well done!</div>'; }
        } else alert('Wrong — try again from the casino');
      };
    });
  })();
}

/* Air (simple) */
function initAir(area){
  area.innerHTML = `<div class="small">Air (mini) — simple play</div><canvas id="air-canvas" width="360" height="200" style="margin-top:8px"></canvas><div style="margin-top:8px"><button id="air-start" class="btn">Start</button><button id="air-stop" class="btn secondary">Stop</button></div>`;
  const canvas = area.querySelector('#air-canvas'); const ctx = canvas.getContext('2d');
  let state = null;
  area.querySelector('#air-start').addEventListener('click', ()=> {
    if(!state) initMatch(); state.running = true;
  });
  area.querySelector('#air-stop').addEventListener('click', ()=> { if(state) state.running = false; });
  function initMatch(){
    state = {paddleY:canvas.height/2, aiY:canvas.height/2, puck:{x:canvas.width/2,y:canvas.height/2,vx:3,vy:2,r:6}, scoreP:0, scoreAI:0, running:false, sonar:[]};
    canvas.onmousemove = (e)=>{ const r=canvas.getBoundingClientRect(); state.paddleY = Math.max(12, Math.min(canvas.height-12, e.clientY - r.top)); };
    function loop(){ requestAnimationFrame(loop); if(!state) return; if(state.running){ state.puck.x += state.puck.vx; state.puck.y += state.puck.vy; if(state.puck.y <= state.puck.r || state.puck.y >= canvas.height - state.puck.r) state.puck.vy *= -1; const dx = state.puck.x - 20, dy = state.puck.y - state.paddleY; if(Math.hypot(dx,dy) < state.puck.r + 12 && state.puck.vx < 0){ state.puck.vx = Math.abs(state.puck.vx) + 0.8; state.puck.vy += dy*0.05; } const dx2 = state.puck.x - (canvas.width-20), dy2 = state.puck.y - state.aiY; if(Math.hypot(dx2,dy2) < state.puck.r + 12 && state.puck.vx > 0){ state.puck.vx = -Math.abs(state.puck.vx) - 0.8; state.puck.vy += dy2*0.05; } state.aiY += (state.puck.y - state.aiY)*0.05; if(state.puck.x < 0){ state.scoreAI++; resetP(); } if(state.puck.x > canvas.width){ state.scoreP++; resetP(); } } draw(); }
    function resetP(){ state.puck.x = canvas.width/2; state.puck.y = canvas.height/2; state.puck.vx = (Math.random()>0.5?3:-3); state.puck.vy = (Math.random()-0.5)*3; }
    function draw(){ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#e6fbff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#1a73e8'; ctx.fillRect(12, state.paddleY-18, 8, 36); ctx.fillStyle='#ff6b6b'; ctx.fillRect(canvas.width-20, state.aiY-18, 8, 36); ctx.beginPath(); ctx.fillStyle='#06263a'; ctx.arc(state.puck.x,state.puck.y,state.puck.r,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#072033'; ctx.font='14px Inter'; ctx.fillText(state.scoreP+' - '+state.scoreAI, canvas.width/2 - 12, 16); } loop();
  }
}

/* --------------------------
   Helpers used above
   -------------------------- */
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function generateMathQuestion(level){
  level = Math.max(1, Math.min(50, Math.round(level)));
  if(level <= 8){ const a=randInt(1,12), b=randInt(1,12); return {q:`${a} + ${b} = ?`, choices: shuffle([String(a+b), String(a+b+1), String(Math.abs(a-b)), String(a*b)]), answer:String(a+b)}; }
  if(level <= 16){ const a=randInt(2,15), b=randInt(2,12); return {q:`${a} × ${b} = ?`, choices: shuffle([String(a*b), String(a*b+randInt(1,6)), String(a*b-randInt(1,6)), String(a+b)]), answer:String(a*b)}; }
  if(level <= 24){ const a=randInt(10,80), b=randInt(2,9); return {q:`${a} ÷ ${b} = ? (nearest int)`, choices: shuffle([String(Math.round(a/b)), String(Math.floor(a/b)), String(Math.ceil(a/b)), String(Math.round((a+b)/b))]), answer:String(Math.round(a/b))}; }
  if(level <= 32){ const a=randInt(2,12), b=randInt(2,6); return {q:`What is ${a}^${b}?`, choices: shuffle([String(Math.pow(a,b)), String(Math.pow(a,b)+randInt(1,20)), String(Math.pow(a+1,b)), String(Math.pow(a,b)-randInt(1,20))]), answer:String(Math.pow(a,b))}; }
  if(level <= 40){ const a=randInt(10,60), b=randInt(2,12), c=randInt(1,10); const val = a + b*c; return {q:`${a} + ${b} × ${c} = ?`, choices: shuffle([String(val), String(val+1), String(val-1), String(a*b+c)]), answer:String(val)}; }
  if(level <= 46){ const a=randInt(1,9), b=randInt(1,9), c=randInt(1,9); const val = Number(((a/b)+(c/b)).toFixed(2)); return {q:`${a}/${b} + ${c}/${b} = ? (2 dp)`, choices: shuffle([String(val), String(Number((val+0.5).toFixed(2))), String(Number((val-0.25).toFixed(2))), String(Number((val+0.1).toFixed(2)))]), answer:String(val)}; }
  const a=randInt(2,12), b=randInt(2,12), c=randInt(1,10); const val = (a*b + c)/a; return {q:`Solve: ${a}x - ${c} = ${a*b}. x = ?`, choices: shuffle([String(val), String(Math.floor(val)), String(Math.ceil(val)), String(b)]), answer:String(val)};
}
function shuffle(arr){ const r = arr.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i], r[j]]=[r[j], r[i]] } return r; }
function celebrateConfetti(){ spawnConfetti(); }
function spawnConfetti(){ spawnConfettiAt(); }
function spawnConfettiAt(x=window.innerWidth/2, y=window.innerHeight/3){ for(let i=0;i<60;i++) particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.8)*6,life:80+Math.random()*40,size:3+Math.random()*7,h:Math.random()*360}); }
