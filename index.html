<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BREAK THE LOGIC — Math Hub (All Games Front Page)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6fbff; --card:#fff; --accent:#1a73e8; --muted:#5b6b86;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,system-ui,Arial,sans-serif;color:#072033}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--card);border-bottom:1px solid rgba(7,32,51,0.06)}
  .brand{font-weight:900;font-size:22px}
  .controls{display:flex;gap:12px;align-items:center}
  .points{background:linear-gradient(90deg,#fff,#f3fbff);padding:8px 12px;border-radius:10px;border:1px solid rgba(7,32,51,0.04);font-weight:800}
  .btn{background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;border:0;cursor:pointer;font-weight:700}
  .btn.secondary{background:transparent;border:1px solid rgba(7,32,51,0.06);color:#072033}
  main{padding:16px 22px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .tile{background:var(--card);border-radius:10px;padding:12px;border:1px solid rgba(7,32,51,0.04);position:relative}
  .tile h3{margin:0 0 6px 0}
  .small{font-size:13px;color:var(--muted)}
  .playRow{display:flex;gap:8px;align-items:center;margin-top:8px}
  .gameArea{margin-top:10px;border-top:1px dashed rgba(7,32,51,0.05);padding-top:10px;display:none}
  .show{display:block}
  .answers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
  .ans-btn{padding:10px;border-radius:8px;border:1px solid rgba(7,32,51,0.06);background:#fff;cursor:pointer;font-weight:700}
  canvas{display:block;border-radius:8px;background:#f7fbff;border:1px solid rgba(7,32,51,0.04)}
  .reel{display:inline-block;width:92px;height:92px;border-radius:8px;background:#fff;border:1px solid rgba(7,32,51,0.06);display:flex;align-items:center;justify-content:center;font-size:32px;margin-right:6px}
  #fxCanvas{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999}
  .points-popup{position:fixed;padding:6px 10px;border-radius:999px;background:linear-gradient(90deg,#ffd27a,#ff8c6b);color:#061226;font-weight:800;pointer-events:none;transform:translate(-50%,-50%);transition:transform 700ms,opacity 700ms}
  @media(max-width:900px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="brand">BREAK THE LOGIC — Math Hub</div>
  <div class="controls">
    <div class="points">Points: <span id="points">0</span></div>
    <button class="btn secondary" id="exportBtn">Export</button>
    <button class="btn secondary" id="resetBtn">Reset</button>
  </div>
</header>

<main>
  <div class="grid" id="tilesGrid">
    <!-- Tiles inserted by JS (but include fallback markup for clarity) -->
  </div>
</main>

<canvas id="fxCanvas"></canvas>
<div id="popupLayer"></div>

<script>
/* --------------------------
   Simple, robust single-file app
   All games are embedded in tiles on the home page. Buttons reliably work.
   -------------------------- */

/* Storage */
const POINTS_KEY = 'btl_points_v6';
if(!localStorage.getItem(POINTS_KEY)) localStorage.setItem(POINTS_KEY,'0');
function getPoints(){ return Number(localStorage.getItem(POINTS_KEY)||0); }
function setPoints(v){ localStorage.setItem(POINTS_KEY, String(v)); renderPoints(); }
function addPoints(n, opts={x:null,y:null}){ setPoints(Math.max(0, getPoints()+n)); if(n!==0) showPointsPopup(opts.x, opts.y, (n>0?'+':'')+n); }

/* render points */
function renderPoints(){ document.getElementById('points').textContent = getPoints(); }
renderPoints();

/* fireworks/confetti simple */
const fxCanvas = document.getElementById('fxCanvas'); fxCanvas.width = innerWidth; fxCanvas.height = innerHeight; const fxCtx = fxCanvas.getContext('2d');
window.addEventListener('resize', ()=>{ fxCanvas.width = innerWidth; fxCanvas.height = innerHeight; });

let particles = [];
function spawnFirework(x,y){
  for(let i=0;i<80;i++){
    const a = Math.random()*Math.PI*2, s = 1 + Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:80+Math.floor(Math.random()*40),h:Math.floor(Math.random()*360)});
  }
}
function spawnConfetti(){
  for(let i=0;i<80;i++){
    particles.push({x:Math.random()*innerWidth,y:-10,vx:(Math.random()-0.5)*4,vy:1+Math.random()*4,life:100+Math.floor(Math.random()*80),size:4+Math.random()*8,h:Math.floor(Math.random()*360)});
  }
}
function celebrate(){
  const cx = innerWidth/2, cy = innerHeight/3;
  for(let i=0;i<5;i++) setTimeout(()=> spawnFirework(cx + (Math.random()-0.5)*300, cy + (Math.random()-0.5)*150), i*280);
  spawnConfetti();
}
function fxLoop(){
  fxCtx.clearRect(0,0,fxCanvas.width, fxCanvas.height);
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life--;
    fxCtx.beginPath();
    if(p.size){
      fxCtx.fillStyle = `hsl(${p.h} 80% 60% / ${Math.max(0, p.life/120)})`;
      fxCtx.fillRect(p.x, p.y, p.size, p.size);
    } else {
      fxCtx.fillStyle = `hsl(${p.h} 80% 60% / ${Math.max(0, p.life/120)})`;
      fxCtx.arc(p.x,p.y,2,0,Math.PI*2); fxCtx.fill();
    }
    if(p.life<=0) particles.splice(i,1);
  }
  requestAnimationFrame(fxLoop);
}
fxLoop();

/* Gimkit-like points popup */
const popupLayer = document.getElementById('popupLayer');
function showPointsPopup(x,y,text){
  const sx = x != null ? x : window.innerWidth/2;
  const sy = y != null ? y : window.innerHeight/3;
  const el = document.createElement('div'); el.className='points-popup'; el.style.left = sx+'px'; el.style.top = sy+'px'; el.textContent = text;
  popupLayer.appendChild(el);
  // float then fly to counter
  requestAnimationFrame(()=> el.style.transform = 'translate(-50%,-120%) scale(1.12)');
  setTimeout(()=>{
    const target = document.querySelector('.points').getBoundingClientRect();
    const dx = (target.left + target.width/2) - sx;
    const dy = (target.top + target.height/2) - sy;
    el.style.transition = 'transform 900ms cubic-bezier(.2,.9,.2,1), opacity 900ms';
    el.style.transform = `translate(${dx}px, ${dy}px) scale(.35)`;
    el.style.opacity = '0';
    setTimeout(()=> el.remove(), 950);
  }, 600);
}

/* --------------------------
   Game tile builder: embed each game UI in its tile so Play works in place
   -------------------------- */

const tilesSpec = [
  { id: 'trivia', title: 'Trivia (50 levels)', desc: '50 math levels. Round = 10 questions. Pass 7/10 to advance.' },
  { id: 'rapid', title: 'Rapid Fire', desc: 'Timed quick math (speed + accuracy).' },
  { id: 'maze', title: 'Math Maze', desc: 'Top-down mini maze with math gates.' },
  { id: 'pattern', title: 'Pattern Builder', desc: 'Complete number sequences.' },
  { id: 'prob', title: 'Probability Cups', desc: 'Pick the cup with highest expected value.' },
  { id: 'casino', title: 'Casino', desc: 'Three machines (slots, secret cups, jackpot → air hockey).' },
  { id: 'cups', title: 'Secret Cups', desc: 'Red-cups shuffle challenge (unlockable via casino).' },
  { id: 'air', title: 'Air Hockey', desc: 'Unlocked by Jackpot. Sonar treasure math questions.' }
];

const grid = document.getElementById('tilesGrid');

tilesSpec.forEach(spec => {
  const tile = document.createElement('div'); tile.className = 'tile'; tile.id = 'tile-'+spec.id;
  tile.innerHTML = `
    <h3>${spec.title}</h3>
    <div class="small">${spec.desc}</div>
    <div class="playRow">
      <button class="btn" data-action="play" data-game="${spec.id}">Play</button>
      <button class="btn secondary" data-action="close" data-game="${spec.id}">Close</button>
      <div style="flex:1"></div>
      <div class="small" data-status="${spec.id}">Ready</div>
    </div>
    <div class="gameArea" id="area-${spec.id}"></div>
  `;
  grid.appendChild(tile);
});

/* Utility: show/close game area */
function openGame(gameId){
  const area = document.getElementById('area-'+gameId);
  if(!area) return;
  area.classList.add('show');
  // initialize UI only once
  if(!area.dataset.inited){
    area.dataset.inited = '1';
    initGameUI(gameId, area);
  }
}
function closeGame(gameId){
  const area = document.getElementById('area-'+gameId);
  if(!area) return;
  area.classList.remove('show');
}

/* Attach button listeners on grid (delegation) */
grid.addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const action = btn.dataset.action;
  const game = btn.dataset.game;
  if(action === 'play') openGame(game);
  if(action === 'close') closeGame(game);
});

/* --------------------------
   Game UI initializers
   Each game's UI is created under its tile's .gameArea (so everything runs in place)
   -------------------------- */

function initGameUI(gameId, area){
  if(gameId === 'trivia') initTrivia(area);
  if(gameId === 'rapid') initRapid(area);
  if(gameId === 'maze') initMaze(area);
  if(gameId === 'pattern') initPattern(area);
  if(gameId === 'prob') initProb(area);
  if(gameId === 'casino') initCasino(area);
  if(gameId === 'cups') initCups(area);
  if(gameId === 'air') initAir(area);
}

/* --------------------------
   TRIVIA (50 levels) - embedded
   -------------------------- */
function initTrivia(area){
  const html = document.createElement('div');
  html.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center">
      <label>Level: <select id="trivia-level"></select></label>
      <button id="trivia-start" class="btn">Start Round</button>
      <div style="flex:1"></div>
      <div class="small">Pass ≥ 7/10 → advance</div>
    </div>
    <div id="trivia-ui" style="margin-top:10px"></div>
  `;
  area.appendChild(html);
  const levelSelect = area.querySelector('#trivia-level');
  for(let i=1;i<=50;i++){ const o=document.createElement('option'); o.value=i; o.text='Level '+i; levelSelect.appendChild(o); }
  const ui = area.querySelector('#trivia-ui');
  area.querySelector('#trivia-start').addEventListener('click', ()=>{
    const level = Number(levelSelect.value);
    startTriviaRound(level, ui);
  });
}
function startTriviaRound(level, container){
  const questions = [];
  for(let i=0;i<10;i++) questions.push(generateMathQuestion(level + Math.floor(i/4)));
  let idx=0, score=0;
  function render(){
    container.innerHTML = '';
    if(idx >= questions.length){
      // results
      const wrap = document.createElement('div'); wrap.innerHTML = `<div style="font-weight:800">Round complete</div><div class="small">Score: ${score} / ${questions.length}</div>`;
      container.appendChild(wrap);
      if(score >= 7){
        const pts = Math.max(25, Math.round(30 + level * 1.5));
        addPoints(pts);
        setTimeout(()=> celebrate(), 120);
        const adv = document.createElement('button'); adv.className='btn'; adv.textContent='Advance Level'; adv.onclick = ()=> { const next = Math.min(50, level+1); // restart at next
          startTriviaRound(next, container);
        };
        wrap.appendChild(adv);
      } else {
        const retry = document.createElement('button'); retry.className='btn'; retry.textContent='Retry'; retry.onclick = ()=> startTriviaRound(level, container);
        wrap.appendChild(retry);
      }
      return;
    }
    const q = questions[idx];
    const qdiv = document.createElement('div');
    qdiv.innerHTML = `<div class="question">Q${idx+1}: ${q.q}</div>`;
    const answers = document.createElement('div'); answers.className='answers';
    q.choices.forEach(choice=>{
      const b = document.createElement('button'); b.className='ans-btn'; b.textContent = choice;
      b.onclick = (ev) => {
        // disable all
        Array.from(answers.children).forEach(ch=> ch.disabled = true);
        if(choice === q.answer){
          b.style.background = 'linear-gradient(90deg,#e6fff1,#bff6d9)';
          const r = b.getBoundingClientRect();
          addPoints(Math.max(10, Math.round(30 + level * 1.2)), {x: r.left + r.width/2, y: r.top + r.height/2});
          spawnConfetti(); score++;
        } else {
          b.style.background = 'linear-gradient(90deg,#ffecec,#ffd6d6)';
        }
        // reveal correct
        Array.from(answers.children).forEach(ch=> { if(ch.textContent === q.answer) ch.style.border = '2px solid #08c27b'; });
        setTimeout(()=> { idx++; render(); }, 700);
      };
      answers.appendChild(b);
    });
    qdiv.appendChild(answers); container.appendChild(qdiv);
  }
  render();
}

/* small math generator (same progression as earlier) */
function generateMathQuestion(level){
  level = Math.max(1, Math.min(50, Math.round(level)));
  if(level <= 8){
    const a=Math.floor(Math.random()*12)+1, b=Math.floor(Math.random()*12)+1;
    return {q:`${a} + ${b} = ?`, choices: shuffle([String(a+b), String(a+b+1), String(Math.abs(a-b)), String(a*b)]), answer:String(a+b)};
  }
  if(level <= 16){
    const a=Math.floor(Math.random()*14)+2, b=Math.floor(Math.random()*11)+2;
    return {q:`${a} × ${b} = ?`, choices: shuffle([String(a*b), String(a*b+Math.floor(Math.random()*6)+1), String(a+b), String(a*b - (Math.floor(Math.random()*5)+1))]), answer:String(a*b)};
  }
  if(level <= 24){
    const a=Math.floor(Math.random()*70)+10, b=Math.floor(Math.random()*8)+2;
    return {q:`${a} ÷ ${b} = ? (nearest int)`, choices: shuffle([String(Math.round(a/b)), String(Math.floor(a/b)), String(Math.ceil(a/b)), String(Math.round((a+b)/b))]), answer:String(Math.round(a/b))};
  }
  if(level <= 32){
    const a=Math.floor(Math.random()*11)+2, b=Math.floor(Math.random()*5)+2;
    return {q:`What is ${a}^${b}?`, choices: shuffle([String(Math.pow(a,b)), String(Math.pow(a,b)+ (Math.floor(Math.random()*15)+1)), String(Math.pow(a+1,b)), String(Math.pow(a,b)-(Math.floor(Math.random()*10)+1))]), answer:String(Math.pow(a,b))};
  }
  if(level <= 40){
    const a=Math.floor(Math.random()*50)+10, b=Math.floor(Math.random()*11)+2, c=Math.floor(Math.random()*9)+1;
    const val = a + b*c;
    return {q:`${a} + ${b} × ${c} = ?`, choices: shuffle([String(val), String(val+1), String(val-1), String(a*b+c)]), answer:String(val)};
  }
  if(level <= 46){
    const a=Math.floor(Math.random()*8)+1, b=Math.floor(Math.random()*8)+1, c=Math.floor(Math.random()*8)+1;
    const val = Number(((a/b)+(c/b)).toFixed(2));
    return {q:`${a}/${b} + ${c}/${b} = ? (2 dp)`, choices: shuffle([String(val), String(Number((val+0.5).toFixed(2))), String(Number((val-0.25).toFixed(2))), String(Number((val+0.1).toFixed(2)))]), answer:String(val)};
  }
  // advanced
  const a=Math.floor(Math.random()*11)+2, b=Math.floor(Math.random()*11)+2, c=Math.floor(Math.random()*9)+1;
  const val = (a*b + c)/a;
  return {q:`Solve: ${a}x - ${c} = ${a*b}. x = ?`, choices: shuffle([String(val), String(Math.floor(val)), String(Math.ceil(val)), String(b)]), answer:String(val)};
}
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }

/* --------------------------
   Rapid Fire UI
   -------------------------- */
function initRapid(area){
  area.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center">
      <label>Difficulty:
        <select id="rapid-diff"><option value="easy">Easy (6s)</option><option value="medium">Medium (4s)</option><option value="hard">Hard (2.5s)</option></select>
      </label>
      <button id="rapid-start" class="btn">Start</button>
      <div style="flex:1"></div>
      <div class="small">Corrects = points fly to counter</div>
    </div>
    <div id="rapid-ui" style="margin-top:10px"></div>
  `;
  area.querySelector('#rapid-start').addEventListener('click', ()=>{
    const diff = area.querySelector('#rapid-diff').value;
    startRapidRound(diff, area.querySelector('#rapid-ui'));
  });
}
function startRapidRound(diff, ui){
  const timePer = diff==='easy'?6: diff==='medium'?4:2.5;
  const questions = Array.from({length:12}, ()=> generateMathQuestion(randInt(1,45)));
  let idx=0, score=0, timer=null;
  function render(){
    ui.innerHTML='';
    if(idx >= questions.length){ const pts = score*8; addPoints(pts); ui.innerHTML = `<div class="small">Done — ${score}/${questions.length}. +${pts} pts</div>`; if(score >= Math.ceil(questions.length*0.6)) { celebrate(); } return; }
    const q = questions[idx];
    const div=document.createElement('div'); div.innerHTML = `<div class="question">Q${idx+1}: ${q.q}</div><div class="small">Time: <span id="rapidTime">${timePer.toFixed(1)}</span>s</div>`;
    const answers = document.createElement('div'); answers.className='answers';
    q.choices.forEach(choice=>{ const b=document.createElement('button'); b.className='ans-btn'; b.textContent=choice; b.onclick=(ev)=>{ clearInterval(timer); if(choice===q.answer){ score++; const r=b.getBoundingClientRect(); addPoints(10,{x:r.left+r.width/2,y:r.top+r.height/2}); celebrateConfettiSmall(r.left+r.width/2,r.top+r.height/2); } idx++; render(); }; answers.appendChild(b); });
    div.appendChild(answers); ui.appendChild(div);
    // countdown
    let t = timePer;
    ui.querySelector('#rapidTime').textContent = t.toFixed(1);
    timer = setInterval(()=>{ t-=0.1; const el = ui.querySelector('#rapidTime'); if(el) el.textContent = t.toFixed(1); if(t<=0){ clearInterval(timer); idx++; render(); } }, 100);
  }
  render();
}

/* --------------------------
   Math Maze (simple top-down) inside tile
   -------------------------- */
function initMaze(area){
  const w = 360, h = 360;
  area.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center">
      <button id="maze-start" class="btn">Generate & Start</button>
      <div style="flex:1"></div>
      <div class="small">Use arrow keys to move. Passing through gates requires answering a math question.</div>
    </div>
    <canvas id="maze-canvas" width="${w}" height="${h}" style="margin-top:10px"></canvas>
  `;
  const canvas = area.querySelector('#maze-canvas'); const ctx = canvas.getContext('2d');
  let maze = null, cellSize = 20, player = {x:1,y:1};
  area.querySelector('#maze-start').addEventListener('click', ()=>{
    maze = generateMazeGrid(17,17); cellSize = Math.floor(Math.min(w/maze.w, h/maze.h)); player = {x:1,y:1}; draw();
    document.addEventListener('keydown', onKey);
  });
  function onKey(e){
    if(!maze) return;
    const dir = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0]}[e.key];
    if(!dir) return;
    const nx = player.x + dir[0], ny = player.y + dir[1];
    if(nx<0||ny<0||nx>=maze.w||ny>=maze.h) return;
    const cell = maze.grid[ny][nx];
    if(cell === 1) return; // wall
    if(cell === 2){ // gate - ask question
      const q = generateMathQuestion(randInt(1,30));
      const choice = prompt(`Gate question: ${q.q}\nChoices: ${q.choices.join(' | ')}`);
      if(choice === null) return;
      if(String(choice).trim() === String(q.answer)){
        maze.grid[ny][nx] = 0; addPoints(15, {x:canvas.getBoundingClientRect().left + nx*cellSize, y:canvas.getBoundingClientRect().top + ny*cellSize}); draw();
      } else { alert('Wrong — gate stays locked'); return; }
    } else {
      player.x = nx; player.y = ny;
    }
    draw();
    if(maze.exit.x === player.x && maze.exit.y === player.y){
      addPoints(60); celebrate(); alert('You reached the exit! +60 pts');
      document.removeEventListener('keydown', onKey);
    }
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let y=0;y<maze.h;y++){
      for(let x=0;x<maze.w;x++){
        const v = maze.grid[y][x];
        if(v===1){ ctx.fillStyle = '#133'; ctx.fillRect(x*cellSize,y*cellSize,cellSize,cellSize); }
        else if(v===2){ ctx.fillStyle = '#b36'; ctx.fillRect(x*cellSize,y*cellSize,cellSize,cellSize); ctx.fillStyle='#fff'; ctx.fillText('?', x*cellSize+cellSize/2-4, y*cellSize+cellSize/2+5); }
        else { ctx.fillStyle = '#f7fff7'; ctx.fillRect(x*cellSize,y*cellSize,cellSize,cellSize); }
      }
    }
    // player
    ctx.fillStyle='#1a73e8'; ctx.beginPath(); ctx.arc((player.x+0.5)*cellSize,(player.y+0.5)*cellSize, cellSize*0.35,0,Math.PI*2); ctx.fill();
    // exit
    ctx.fillStyle='#ff9'; ctx.fillRect(maze.exit.x*cellSize+cellSize*0.15, maze.exit.y*cellSize+cellSize*0.15, cellSize*0.7, cellSize*0.7);
  }
  function generateMazeGrid(cols, rows){
    if(cols%2===0) cols++; if(rows%2===0) rows++;
    const grid = Array.from({length:rows}, ()=>Array(cols).fill(1));
    for(let y=1;y<rows;y+=2) for(let x=1;x<cols;x+=2) grid[y][x]=0;
    function neighbors(x,y){ const n=[]; if(y-2>0) n.push([x,y-2]); if(y+2<rows-1) n.push([x,y+2]); if(x-2>0) n.push([x-2,y]); if(x+2<cols-1) n.push([x+2,y]); return n; }
    const stack=[[1,1]]; const visited=new Set(['1,1']);
    while(stack.length){
      const [cx,cy] = stack[stack.length-1];
      const opts = neighbors(cx,cy).filter(n=> !visited.has(n.join(',')));
      if(opts.length){
        const n = opts[Math.floor(Math.random()*opts.length)]; const wx=(cx+n[0])/2, wy=(cy+n[1])/2; grid[wy][wx]=0; visited.add(n.join(',')); stack.push(n);
      } else stack.pop();
    }
    // place some gates (value 2) randomly on wall cells adjacent to path
    const gates = 6;
    for(let i=0;i<gates;i++){
      let placed=false;
      for(let tries=0;tries<400 && !placed;tries++){
        const gx = Math.floor(Math.random()*(cols-2))+1, gy = Math.floor(Math.random()*(rows-2))+1;
        if(grid[gy][gx]===1){
          const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
          if(dirs.some(d=> grid[gy+d[1]][gx+d[0]]===0)){ grid[gy][gx]=2; placed=true; }
        }
      }
    }
    // exit near far corner path cell
    let ex=cols-2, ey=rows-2; while(grid[ey][ex] !==0){ ex--; if(ex<1){ ex=cols-2; ey--; if(ey<1) break; } }
    return {grid, w:cols, h:rows, exit:{x:ex,y:ey}};
  }
}

function initPattern(area){
  area.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center">
      <label>Level: <select id="pattern-level"></select></label>
      <button id="pattern-start" class="btn">Start</button>
      <div style="flex:1"></div>
      <div class="small">Complete 5 sequences to finish</div>
    </div>
    <div id="pattern-ui" style="margin-top:10px"></div>
  `;
  const sel = area.querySelector('#pattern-level');
  for(let i=1;i<=30;i++){ const o=document.createElement('option'); o.value=i; o.text='Level '+i; sel.appendChild(o); }
  area.querySelector('#pattern-start').addEventListener('click', ()=> startPatternRound(Number(sel.value), area.querySelector('#pattern-ui')));
}
function startPatternRound(level, ui){
  let i=0, score=0;
  function next(){
    if(i>=5){ ui.innerHTML = `<div class="small">Finished: ${score}/5</div>`; addPoints(score*15); if(score>=3) celebrate(); return; }
    const p = generatePattern(level + i);
    ui.innerHTML = `<div class="small">Pattern: ${p.type}</div><div class="question">${p.seq.join(', ')}, ...</div><input id="pattern-input" style="padding:8px;border-radius:6px;border:1px solid #ddd"><button id="pattern-submit" class="btn" style="margin-left:8px">Submit</button>`;
    ui.querySelector('#pattern-submit').onclick = ()=>{
      const val = ui.querySelector('#pattern-input').value;
      if(String(val) === String(p.next)){ score++; const rect = ui.querySelector('#pattern-submit').getBoundingClientRect(); addPoints(15, {x:rect.left+rect.width/2, y: rect.top }); celebrateConfettiSmall(rect.left+rect.width/2, rect.top); }
      else alert('Incorrect — answer was '+p.next);
      i++; next();
    };
  }
  next();
}
function generatePattern(level){
  level = Math.max(1, Math.min(30, level));
  const types = ['arithmetic','geometric','fib-like','alternating','squares'];
  const t = types[level % types.length];
  if(t==='arithmetic'){ const a=randInt(1,6), d=randInt(1,8); const seq=[a,a+d,a+2*d,a+3*d,a+4*d]; return {seq, next: a+5*d, type: 'Arithmetic +'+d}; }
  if(t==='geometric'){ const a=randInt(1,4), r=randInt(2,4); const seq=[a,a*r,a*r*r,a*r*r*r,a*r*r*r*r]; return {seq, next: a*Math.pow(r,5), type: 'Geometric ×'+r}; }
  if(t==='fib-like'){ const a=randInt(1,5), b=randInt(1,6); const seq=[a,b,a+b,b+(a+b),(a+b)+(b+(a+b))]; return {seq, next: seq[3]+seq[4], type:'Fib-like'}; }
  if(t==='alternating'){ const a=randInt(1,6), b=randInt(7,12); const seq=[a,b,a+b,a+2*b,a+3*b]; return {seq,next: a+4*b, type:'Alternating'}; }
  const s=randInt(1,6); const seq=[s,s+1,s+4,s+9,s+16]; return {seq, next: s+25, type:'Squares offset'};
}

/* --------------------------
   Probability
   -------------------------- */
function initProb(area){
  area.innerHTML = `<div style="display:flex;gap:8px;align-items:center"><button id="prob-start" class="btn">Start</button><div style="flex:1"></div><div class="small">Pick highest EV</div></div><div id="prob-ui" style="margin-top:10px"></div>`;
  area.querySelector('#prob-start').addEventListener('click', ()=> {
    const q = generateProbQuestion(); renderProbUI(q, area.querySelector('#prob-ui'));
  });
}
function generateProbQuestion(){
  const base = randInt(5,30);
  const p1 = Math.random()*0.6 + 0.1, p2 = Math.random()*0.6 + 0.05, p3 = Math.random()*0.6 + 0.02;
  const a1 = base + randInt(0, base), a2 = base + randInt(0, base+10), a3 = base + randInt(0, base+20);
  return {cups:[{label:'A',p:+p1.toFixed(2),payout:a1,ev: +(p1*a1).toFixed(2)},{label:'B',p:+p2.toFixed(2),payout:a2,ev: +(p2*a2).toFixed(2)},{label:'C',p:+p3.toFixed(2),payout:a3,ev: +(p3*a3).toFixed(2)}]};
}
function renderProbUI(q, container){
  container.innerHTML = `<div class="question">Choose the best expected value (EV)</div>`;
  const row = document.createElement('div'); row.style.display='flex'; row.style.gap='8px';
  q.cups.forEach(c=>{
    const el = document.createElement('div'); el.style.flex='1'; el.style.padding='12px'; el.style.border='1px solid #eee'; el.style.borderRadius='8px'; el.style.textAlign='center';
    el.innerHTML = `<div style="font-weight:800">${c.label}</div><div class="small">Payout: ${c.payout}</div><div class="small">Chance: ${Math.round(c.p*100)}%</div>`;
    el.addEventListener('click', ()=>{
      const best = q.cups.reduce((a,b)=> a.ev > b.ev ? a : b);
      if(c.label === best.label){ addPoints(20); celebrateConfettiSmall(); alert(`Correct — ${c.label} has EV ${c.ev}. +20 pts`); }
      else alert(`Incorrect — best was ${best.label} (EV ${best.ev})`);
      renderProbUI(generateProbQuestion(), container);
    });
    row.appendChild(el);
  });
  container.appendChild(row);
}

/* embedded secret cups (in casino area) */
function openSecretCupsEmbedded(container){
  container.innerHTML = '';
  const info = document.createElement('div'); info.className='small'; info.textContent = 'Secret Cups — beat 3 levels to win 250 pts';
  container.appendChild(info);
  // start level 1
  startCupsLevelEmbedded(container, 1);
}
function startCupsLevelEmbedded(container, level){
  container.querySelectorAll('.cups-area')?.forEach(e=>e.remove());
  const wrap = document.createElement('div'); wrap.className='cups-area'; wrap.style.marginTop='8px'; container.appendChild(wrap);
  const cupEls = [];
  let ballIndex = randInt(0,2);
  for(let i=0;i<3;i++){
    const cup = document.createElement('div'); cup.className='cup'; cup.style.display='inline-block'; cup.style.marginRight='8px'; cup.style.width='90px'; cup.style.height='90px'; cup.style.position='relative';
    cup.style.backgroundColor = '#d33';
    const ball = document.createElement('div'); ball.className='ball'; ball.style.width='22px'; ball.style.height='22px'; ball.style.borderRadius='50%'; ball.style.background='#ffd'; ball.style.position='absolute'; ball.style.left='50%'; ball.style.bottom='14px'; ball.style.transform='translateX(-50%)'; ball.style.opacity = (i===ballIndex)?'1':'0';
    cup.appendChild(ball); wrap.appendChild(cup); cupEls.push(cup);
  }
  // hide ball after short
  setTimeout(()=> cupEls.forEach(c=> c.querySelector('.ball').style.opacity='0'), 700);
  const cfg = level===1?{sh:6,spd:220}: level===2?{sh:12,spd:160}:{sh:20,spd:120};
  async function shuffle(sh, spd){
    for(let s=0;s<sh;s++){
      // swap two random cups visually
      const a = randInt(0,2), b = (a + randInt(1,2))%3;
      const ca = cupEls[a], cb = cupEls[b];
      // swap DOM order by clone to avoid layout jump complexity
      const cloneA = ca.cloneNode(true), cloneB = cb.cloneNode(true);
      ca.replaceWith(cloneB); cb.replaceWith(cloneA);
      cupEls[a] = cloneB; cupEls[b] = cloneA;
      await new Promise(r=>setTimeout(r, spd));
    }
  }
  (async ()=>{
    await new Promise(r=>setTimeout(r, 700));
    await shuffle(cfg.sh, cfg.spd);
    const info2 = document.createElement('div'); info2.className='small'; info2.textContent = 'Pick a cup!';
    container.appendChild(info2);
    cupEls.forEach((cup, idx)=>{
      cup.style.cursor='pointer';
      cup.onclick = ()=>{
        // reveal
        cupEls.forEach(c=> c.querySelector('.ball').style.opacity='0');
        cup.querySelector('.ball').style.opacity='1';
        const revealedIndex = cupEls.findIndex(c=> c.querySelector('.ball').style.opacity === '1');
        if(revealedIndex === idx){
          if(level < 3) { setTimeout(()=> { startCupsLevelEmbedded(container, level+1); }, 800); addPoints(15); celebrateConfettiSmall(); }
          else { addPoints(250); celebrate(); alert('You beat level 3! +250 pts'); container.innerHTML = '<div class="small">Completed. Great job!</div>'; }
        } else {
          alert('Wrong — try again from the casino.');
        }
      };
    });
  })();
}

/* --------------------------
   Air tile initializer (simple notice + start button)
   -------------------------- */
function initAir(area){
  area.innerHTML = `
    <div class="small">Air Hockey (basic in-tile). Click Start to play. Score triggers sonar math prompts.</div>
    <canvas id="air-canvas" width="400" height="220" style="margin-top:8px"></canvas>
    <div style="margin-top:8px">
      <button id="air-start" class="btn">Start Match</button>
      <button id="air-stop" class="btn secondary">Stop</button>
      <div style="display:inline-block;margin-left:8px" id="air-score">0 - 0</div>
    </div>
  `;
  const canvas = area.querySelector('#air-canvas'); const ctx = canvas.getContext('2d');
  let state = null;
  area.querySelector('#air-start').addEventListener('click', ()=>{
    if(!state) initMatch();
    state.running = true;
  });
  area.querySelector('#air-stop').addEventListener('click', ()=> { if(state) state.running = false; });
  function initMatch(){
    state = {paddleY:canvas.height/2, aiY:canvas.height/2, puck:{x:canvas.width/2,y:canvas.height/2,vx:3,vy:2,r:6}, scoreP:0, scoreAI:0, running:false, sonar:[]};
    canvas.onmousemove = (e)=> { const r = canvas.getBoundingClientRect(); state.paddleY = Math.max(12, Math.min(canvas.height-12, e.clientY - r.top)); };
    function loop(){
      requestAnimationFrame(loop);
      if(!state) return;
      if(state.running){
        state.puck.x += state.puck.vx; state.puck.y += state.puck.vy;
        if(state.puck.y <= state.puck.r || state.puck.y >= canvas.height - state.puck.r) state.puck.vy *= -1;
        // paddle hit
        const dx = state.puck.x - 20, dy = state.puck.y - state.paddleY;
        if(Math.hypot(dx,dy) < state.puck.r + 12 && state.puck.vx < 0){ state.puck.vx = Math.abs(state.puck.vx) + 0.8; state.puck.vy += dy*0.05; }
        // ai
        state.aiY += (state.puck.y - state.aiY)*0.05;
        const dx2 = state.puck.x - (canvas.width-20), dy2 = state.puck.y - state.aiY;
        if(Math.hypot(dx2,dy2) < state.puck.r + 12 && state.puck.vx > 0){ state.puck.vx = -Math.abs(state.puck.vx) - 0.8; state.puck.vy += dy2*0.05; }
        if(state.puck.x < 0){ state.scoreAI++; resetP(); triggerSonar(); }
        if(state.puck.x > canvas.width){ state.scoreP++; resetP(); triggerSonar(); }
      }
      draw();
    }
    function resetP(){ state.puck.x = canvas.width/2; state.puck.y = canvas.height/2; state.puck.vx = (Math.random()>0.5?3:-3); state.puck.vy = (Math.random()-0.5)*3; }
    function triggerSonar(){
      const tx = randInt(40, canvas.width-40), ty = randInt(20, canvas.height-20);
      const q = generateMathQuestion(randInt(5,30));
      state.sonar.push({x:tx,y:ty,r:10,q});
      setTimeout(()=>{
        const ans = prompt(`Treasure question: ${q.q}\nChoices: ${q.choices.join(' | ')}`);
        if(ans !== null && String(ans).trim() === String(q.answer)){ addPoints(40); celebrateConfettiSmall(); alert('Correct! +40 pts'); }
        else alert('Incorrect or cancelled');
      }, 900);
    }
    function draw(){
      ctx.clearRect(0,0,canvas.width, canvas.height);
      ctx.fillStyle = '#e6fbff'; ctx.fillRect(0,0,canvas.width, canvas.height);
      // paddles
      ctx.fillStyle='#1a73e8'; ctx.fillRect(12, state.paddleY-18, 8, 36);
      ctx.fillStyle='#ff6b6b'; ctx.fillRect(canvas.width-20, state.aiY-18, 8, 36);
      // puck
      ctx.fillStyle='#06263a'; ctx.beginPath(); ctx.arc(state.puck.x, state.puck.y, state.puck.r,0,Math.PI*2); ctx.fill();
      // sonar
      state.sonar.forEach(s=> { ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.strokeStyle='rgba(12,130,180,0.6)'; ctx.stroke(); s.r += 4; });
      // scores
      ctx.fillStyle='#072033'; ctx.font='14px Inter'; ctx.fillText(`${state.scoreP} - ${state.scoreAI}`, canvas.width/2 - 10, 16);
      document.getElementById('air-score').textContent = `${state.scoreP} - ${state.scoreAI}`;
    }
    loop();
  }
}

/* -----------------------
   Utilities
   ----------------------- */
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function celebrateConfettiSmall(x=null,y=null){ spawnConfettiAt(x,y); }
function spawnConfettiAt(x,y){
  for(let i=0;i<36;i++){ particles.push({x:x||Math.random()*innerWidth,y:y||-10,vx:(Math.random()-0.5)*5,vy:1+Math.random()*4,life:80+Math.floor(Math.random()*40),size:4+Math.random()*8,h:Math.floor(Math.random()*360)}); }
}
